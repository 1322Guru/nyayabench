<svg width="1200" height="720" viewBox="0 0 1200 720"
     xmlns="http://www.w3.org/2000/svg">

<style>
    .title{
        font:700 34px Inter,Arial,sans-serif;
        fill:#ffffff;
    }
    .label{
        font:600 18px Inter,Arial,sans-serif;
        fill:#111827;
    }
    .small{
        font:400 13px Inter,Arial,sans-serif;
        fill:#4b5563;
    }
    .flow{
        font:600 22px Inter,Arial,sans-serif;
        fill:#ffffff;
    }
    .line{
        stroke:#8b949e;
        stroke-width:2.5;
        fill:none;
    }
    .classic{
        fill:#dff5ef;
        stroke:#8ecdbd;
        stroke-width:2;
    }
    .dialectic{
        fill:#fde9df;
        stroke:#f2b89d;
        stroke-width:2;
    }
</style>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10"
        refX="5" refY="5"
        orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="#0d1117"/>

<!-- LEFT PANEL -->

<text x="170" y="60" text-anchor="middle" class="title">
Traditional Evaluation
</text>

<text x="170" y="130" text-anchor="middle" class="flow">
Question
</text>

<line x1="170" y1="145" x2="170" y2="185"
      class="line" marker-end="url(#arrow)"/>

<text x="170" y="235" text-anchor="middle" class="flow">
Language Model
</text>

<line x1="170" y1="250" x2="170" y2="290"
      class="line" marker-end="url(#arrow)"/>

<text x="170" y="340" text-anchor="middle" class="flow">
Final Answer
</text>

<line x1="170" y1="355" x2="170" y2="395"
      class="line" marker-end="url(#arrow)"/>

<text x="170" y="445" text-anchor="middle"
      class="flow">✔ Correct?</text>

<text x="170" y="485" text-anchor="middle"
      class="flow">✘ Why?</text>

<text x="170" y="525" text-anchor="middle"
      class="flow">✘ Reasoning?</text>

<text x="170" y="565" text-anchor="middle"
      class="flow">✘ Counterargument?</text>

<!-- divider -->

<line x1="420" y1="40" x2="420" y2="670"
      stroke="#30363d"
      stroke-width="2"/>

<!-- RIGHT PANEL -->

<text x="810" y="60"
      text-anchor="middle"
      class="title">
NyayaBench
</text>

<text x="810" y="120"
      text-anchor="middle"
      class="flow">
Question
</text>

<line x1="810" y1="135"
      x2="810" y2="170"
      class="line"
      marker-end="url(#arrow)"/>

<text x="810" y="220"
      text-anchor="middle"
      class="flow">
Language Model
</text>

<line x1="810" y1="235"
      x2="810" y2="270"
      class="line"
      marker-end="url(#arrow)"/>

<text x="810" y="320"
      text-anchor="middle"
      class="flow">
Structured Reasoning
</text>

<!-- Branch -->

<line x1="810" y1="335"
      x2="810" y2="365"
      class="line"/>

<line x1="810" y1="365"
      x2="560" y2="365"
      class="line"/>

<!-- Boxes -->

<rect x="520" y="390" width="120" height="48"
      rx="10" class="classic"/>
<text x="580" y="417"
      class="label"
      text-anchor="middle">Claim</text>

<rect x="670" y="390" width="120" height="48"
      rx="10" class="classic"/>
<text x="730" y="417"
      class="label"
      text-anchor="middle">Reason</text>

<rect x="820" y="390" width="120" height="48"
      rx="10" class="classic"/>
<text x="880" y="417"
      class="label"
      text-anchor="middle">Evidence</text>

<rect x="970" y="390" width="120" height="48"
      rx="10" class="classic"/>
<text x="1030" y="417"
      class="label"
      text-anchor="middle">Application</text>

<rect x="520" y="470" width="120" height="48"
      rx="10" class="classic"/>
<text x="580" y="497"
      class="label"
      text-anchor="middle">Conclusion</text>

<rect x="670" y="470" width="120" height="48"
      rx="10" class="dialectic"/>
<text x="730" y="497"
      class="label"
      text-anchor="middle">Counterargument</text>

<rect x="820" y="470" width="120" height="48"
      rx="10" class="dialectic"/>
<text x="880" y="497"
      class="label"
      text-anchor="middle">Resolution</text>

<!-- Connectors -->

<line x1="580" y1="365" x2="580" y2="390" class="line"/>
<line x1="730" y1="365" x2="730" y2="390" class="line"/>
<line x1="880" y1="365" x2="880" y2="390" class="line"/>
<line x1="1030" y1="365" x2="1030" y2="390" class="line"/>

<line x1="580" y1="438" x2="580" y2="470" class="line"/>
<line x1="730" y1="438" x2="730" y2="470" class="line"/>
<line x1="880" y1="438" x2="880" y2="470" class="line"/>

<!-- Downstream -->

<line x1="880" y1="518"
      x2="880" y2="555"
      class="line"
      marker-end="url(#arrow)"/>

<text x="880"
      y="610"
      text-anchor="middle"
      class="flow">
Deterministic Audit
</text>

<line x1="880" y1="625"
      x2="880" y2="655"
      class="line"
      marker-end="url(#arrow)"/>

<text x="880"
      y="705"
      text-anchor="middle"
      class="flow">
Transparent Score
</text>

</svg>
