<?xml version="1.0" encoding="utf-8"?>
<svg width="900" height="740" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Default: GitHub Light Mode Theme Adjustments */
    .txt-heading { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1f2328; }
    .txt-subheading { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0969da; }
    .txt-main { font-family: Arial, sans-serif; font-size: 14px; fill: #24292e; }
    .txt-legend { font-family: Arial, sans-serif; font-size: 12px; fill: #57606a; }
    
    /* Box & Pill Variants */
    .box-neutral { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .box-container-left { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .box-container-right { fill: #f0f7ff; stroke: #54aeff; stroke-width: 1.5; }
    
    /* Reference Image Colored Pills */
    .pill-limb { fill: #e6f4ea; stroke: #137333; stroke-width: 1.5; }
    .txt-limb { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #137333; }
    
    .pill-dialectic { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .txt-dialectic { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #a51d24; }
    
    /* Evaluation Indicators */
    .txt-success { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1a7f37; }
    .txt-danger { font-family: Arial, sans-serif; font-size: 14px; fill: #cf222e; }
    
    /* Connectors */
    .flow-line { stroke: #444c56; stroke-width: 1.5; }
    .divider-line { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 6 4; }
    .arrow-head { fill: #444c56; }

    /* Automatic Switch: GitHub Dark Mode Theme Adjustments */
    @media (prefers-color-scheme: dark) {
      .txt-heading { fill: #f0f6fc; }
      .txt-main { fill: #c9d1d9; }
      .txt-legend { fill: #8b949e; }
      
      .box-neutral { fill: #161b22; stroke: #30363d; }
      .box-container-left { fill: #0d1117; stroke: #30363d; }
      .box-container-right { fill: #102a45; stroke: #1f6feb; }
      
      .pill-limb { fill: #143a21; stroke: #26a641; }
      .txt-limb { fill: #7ee787; }
      
      .pill-dialectic { fill: #3c1e1a; stroke: #da3633; }
      .txt-dialectic { fill: #ff7b72; }
      
      .txt-success { fill: #56d364; }
      .txt-danger { fill: #f85149; }
      
      .flow-line { stroke: #8b949e; }
      .divider-line { stroke: #30363d; }
      .arrow-head { fill: #8b949e; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-head" />
    </marker>
  </defs>

  <line x1="450" y1="40" x2="450" y2="670" class="divider-line" />

  <text x="230" y="50" text-anchor="middle" class="txt-heading">Traditional Evaluation</text>

  <rect x="130" y="90" width="200" height="45" class="box-neutral" rx="6"/>
  <text x="230" y="112.5" text-anchor="middle" dominant-baseline="middle" class="txt-main">Question</text>

  <line x1="230" y1="135" x2="230" y2="158" class="flow-line" marker-end="url(#arrow)"/>

  <rect x="130" y="165" width="200" height="45" class="box-neutral" rx="6"/>
  <text x="230" y="187.5" text-anchor="middle" dominant-baseline="middle" class="txt-main">Language Model</text>

  <line x1="230" y1="210" x2="230" y2="233" class="flow-line" marker-end="url(#arrow)"/>

  <rect x="130" y="240" width="200" height="45" class="box-neutral" rx="6"/>
  <text x="230" y="262.5" text-anchor="middle" dominant-baseline="middle" class="txt-main">Final Answer</text>

  <line x1="230" y1="285" x2="230" y2="308" class="flow-line" marker-end="url(#arrow)"/>

  <rect x="100" y="315" width="260" height="195" class="box-container-left" rx="8"/>
  
  <text x="230" y="350" text-anchor="middle" class="txt-success">&#10004; Correct?</text>
  <text x="230" y="390" text-anchor="middle" class="txt-danger">&#10008; Why?</text>
  <text x="230" y="430" text-anchor="middle" class="txt-danger">&#10008; Reasoning?</text>
  <text x="230" y="470" text-anchor="middle" class="txt-danger">&#10008; Counterargument?</text>


  <text x="670" y="50" text-anchor="middle" class="txt-heading">NyayaBench</text>

  <rect x="570" y="90" width="200" height="45" class="box-neutral" rx="6"/>
  <text x="670" y="112.5" text-anchor="middle" dominant-baseline="middle" class="txt-main">Question</text>

  <line x1="670" y1="135" x2="670" y2="158" class="flow-line" marker-end="url(#arrow)"/>

  <rect x="570" y="165" width="200" height="45" class="box-neutral" rx="6"/>
  <text x="670" y="187.5" text-anchor="middle" dominant-baseline="middle" class="txt-main">Language Model</text>

  <line x1="670" y1="210" x2="670" y2="233" class="flow-line" marker-end="url(#arrow)"/>

  <rect x="490" y="240" width="360" height="280" class="box-container-right" rx="8"/>
  <text x="670" y="268" text-anchor="middle" class="txt-subheading">Structured Reasoning</text>

  <rect x="510" y="295" width="150" height="35" class="pill-limb" rx="18"/>
  <text x="585" y="312.5" text-anchor="middle" dominant-baseline="middle" class="txt-limb">Claim</text>

  <rect x="690" y="295" width="150" height="35" class="pill-limb" rx="18"/>
  <text x="765" y="312.5" text-anchor="middle" dominant-baseline="middle" class="txt-limb">Reason</text>

  <rect x="510" y="345" width="150" height="35" class="pill-limb" rx="18"/>
  <text x="585" y="362.5" text-anchor="middle" dominant-baseline="middle" class="txt-limb">Evidence</text>

  <rect x="690" y="345" width="150" height="35" class="pill-limb" rx="18"/>
  <text x="765" y="362.5" text-anchor="middle" dominant-baseline="middle" class="txt-limb">Application</text>

  <rect x="600" y="395" width="140" height="35" class="pill-limb" rx="18"/>
  <text x="670" y="412.5" text-anchor="middle" dominant-baseline="middle" class="txt-limb">Conclusion</text>

  <rect x="510" y="455" width="150" height="35" class="pill-dialectic" rx="18"/>
  <text x="585" y="472.5" text-anchor="middle" dominant-baseline="middle" class="txt-dialectic">Counterargument</text>

  <rect x="690" y="455" width="150" height="35" class="pill-dialectic" rx="18"/>
  <text x="765" y="472.5" text-anchor="middle" dominant-baseline="middle" class="txt-dialectic">Resolution</text>

  <line x1="670" y1="520" x2="670" y2="543" class="flow-line" marker-end="url(#arrow)"/>

  <rect x="570" y="550" width="200" height="45" class="box-neutral" rx="6"/>
  <text x="670" y="572.5" text-anchor="middle" dominant-baseline="middle" class="txt-main">Deterministic Audit</text>

  <line x1="670" y1="595" x2="670" y2="618" class="flow-line" marker-end="url(#arrow)"/>

  <rect x="570" y="625" width="200" height="45" class="box-neutral" rx="6"/>
  <text x="670" y="647.5" text-anchor="middle" dominant-baseline="middle" class="txt-main">Transparent Score</text>


  <g transform="translate(310, 705)">
    <rect x="0" y="0" width="14" height="14" class="pill-limb" rx="3"/>
    <text x="22" y="8" dominant-baseline="middle" class="txt-legend">Classical Five-Limb</text>

    <rect x="160" y="0" width="14" height="14" class="pill-dialectic" rx="3"/>
    <text x="182" y="8" dominant-baseline="middle" class="txt-legend">Dialectical Addition</text>
  </g>
</svg>
