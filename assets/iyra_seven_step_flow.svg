<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>IYRA seven-step Nyaya reasoning flow</title>
<desc>A two-row flowchart showing IYRA's seven-step structured reasoning output, extending the classical five-limb Nyaya Panchavayava syllogism (Pratijna, Hetu, Udaharana, Upanaya, Nigamana) with two dialectical additions, Purvapaksha at the start and Siddhanta at the end.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.th { font-size: 14px; font-weight: 700; }
.ts { font-size: 12px; font-weight: 400; }
.conn { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
</style>

<rect x="40" y="50" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="105" y="69" text-anchor="middle" fill="#712B13">Purvapaksha</text>
<text class="ts" x="105" y="87" text-anchor="middle" fill="#993C1D">counter-view</text>

<rect x="188" y="50" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="253" y="69" text-anchor="middle" fill="#085041">Pratijna</text>
<text class="ts" x="253" y="87" text-anchor="middle" fill="#0F6E56">claim</text>

<rect x="336" y="50" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="401" y="69" text-anchor="middle" fill="#085041">Hetu</text>
<text class="ts" x="401" y="87" text-anchor="middle" fill="#0F6E56">reason</text>

<rect x="484" y="50" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="549" y="69" text-anchor="middle" fill="#085041">Udaharana</text>
<text class="ts" x="549" y="87" text-anchor="middle" fill="#0F6E56">example</text>

<line x1="170" y1="78" x2="186" y2="78" class="conn" marker-end="url(#arrow)"/>
<line x1="318" y1="78" x2="334" y2="78" class="conn" marker-end="url(#arrow)"/>
<line x1="466" y1="78" x2="482" y2="78" class="conn" marker-end="url(#arrow)"/>

<path d="M549 106 L549 138 L192 138 L192 168" class="conn" marker-end="url(#arrow)"/>

<rect x="127" y="170" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="192" y="189" text-anchor="middle" fill="#085041">Upanaya</text>
<text class="ts" x="192" y="207" text-anchor="middle" fill="#0F6E56">application</text>

<rect x="275" y="170" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="189" text-anchor="middle" fill="#085041">Nigamana</text>
<text class="ts" x="340" y="207" text-anchor="middle" fill="#0F6E56">conclusion</text>

<rect x="423" y="170" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="488" y="189" text-anchor="middle" fill="#712B13">Siddhanta</text>
<text class="ts" x="488" y="207" text-anchor="middle" fill="#993C1D">settled view</text>

<line x1="257" y1="198" x2="273" y2="198" class="conn" marker-end="url(#arrow)"/>
<line x1="405" y1="198" x2="421" y2="198" class="conn" marker-end="url(#arrow)"/>

<rect x="220" y="244" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="ts" x="238" y="253" fill="#444441">dialectical addition</text>
<rect x="400" y="244" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="ts" x="418" y="253" fill="#444441">classical five-limb</text>
</svg>
