<svg width="900" height="760" viewBox="0 0 900 760"
xmlns="http://www.w3.org/2000/svg">

<style>
svg{
    background:#0d1117;
}

.title{
    fill:#ffffff;
    font:700 30px Inter,Arial,sans-serif;
}

.text{
    fill:#ffffff;
    font:600 18px Inter,Arial,sans-serif;
}

.label{
    fill:#1f2937;
    font:600 15px Inter,Arial,sans-serif;
}

.sub{
    fill:#4b5563;
    font:12px Inter,Arial,sans-serif;
}

.line{
    stroke:#8b949e;
    stroke-width:2;
    fill:none;
}

.classical{
    fill:#dff5ef;
    stroke:#93d2c3;
    stroke-width:1.8;
}

.dialectical{
    fill:#fde9df;
    stroke:#efb79f;
    stroke-width:1.8;
}
</style>

<defs>
<marker id="arrow"
markerWidth="10"
markerHeight="10"
refX="5"
refY="5"
orient="auto">
<path d="M0,0 L10,5 L0,10 Z"
fill="#8b949e"/>
</marker>
</defs>

<!-- Title -->

<text x="450"
y="45"
text-anchor="middle"
class="title">
NyayaBench Pipeline
</text>

<!-- Question -->

<text x="450"
y="95"
text-anchor="middle"
class="text">
Question
</text>

<line x1="450" y1="110"
x2="450" y2="145"
class="line"
marker-end="url(#arrow)"/>

<!-- LM -->

<text x="450"
y="195"
text-anchor="middle"
class="text">
Language Model
</text>

<line x1="450" y1="210"
x2="450" y2="245"
class="line"
marker-end="url(#arrow)"/>

<!-- Structured Reasoning -->

<text x="450"
y="295"
text-anchor="middle"
class="text">
Structured Reasoning
</text>

<line x1="450" y1="310"
x2="450" y2="340"
class="line"/>

<!-- Horizontal Branch -->

<line x1="170" y1="340"
x2="730" y2="340"
class="line"/>

<!-- Top Row -->

<line x1="220" y1="340" x2="220" y2="370" class="line"/>
<line x1="360" y1="340" x2="360" y2="370" class="line"/>
<line x1="500" y1="340" x2="500" y2="370" class="line"/>
<line x1="640" y1="340" x2="640" y2="370" class="line"/>

<rect x="170" y="370" width="100" height="46" rx="8" class="classical"/>
<text x="220" y="398" text-anchor="middle" class="label">Claim</text>

<rect x="310" y="370" width="100" height="46" rx="8" class="classical"/>
<text x="360" y="398" text-anchor="middle" class="label">Reason</text>

<rect x="450" y="370" width="100" height="46" rx="8" class="classical"/>
<text x="500" y="398" text-anchor="middle" class="label">Evidence</text>

<rect x="590" y="370" width="100" height="46" rx="8" class="classical"/>
<text x="640" y="398" text-anchor="middle" class="label">Application</text>

<!-- Bottom Row -->

<rect x="240" y="455" width="120" height="46" rx="8" class="classical"/>
<text x="300" y="483" text-anchor="middle" class="label">Conclusion</text>

<rect x="390" y="455" width="140" height="46" rx="8" class="dialectical"/>
<text x="460" y="483" text-anchor="middle" class="label">Counterargument</text>

<rect x="560" y="455" width="120" height="46" rx="8" class="dialectical"/>
<text x="620" y="483" text-anchor="middle" class="label">Resolution</text>

<line x1="300" y1="416" x2="300" y2="455" class="line"/>
<line x1="460" y1="416" x2="460" y2="455" class="line"/>
<line x1="620" y1="416" x2="620" y2="455" class="line"/>

<!-- Audit -->

<line x1="620" y1="501"
x2="620" y2="545"
class="line"
marker-end="url(#arrow)"/>

<text x="620"
y="595"
text-anchor="middle"
class="text">
Deterministic Audit
</text>

<line x1="620" y1="610"
x2="620" y2="645"
class="line"
marker-end="url(#arrow)"/>

<text x="620"
y="700"
text-anchor="middle"
class="text">
Transparent Score
</text>

</svg>
