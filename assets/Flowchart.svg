<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="black" />
    </marker>
  </defs>

  <text x="400" y="45" text-anchor="middle" font-size="22" font-family="Arial" font-weight="bold" fill="#333">NyayaBench Pipeline</text>

  <rect x="300" y="80" width="200" height="50" fill="#f0f0f0" stroke="black" rx="4"/>
  <text x="400" y="105" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="14">Question</text>

  <rect x="300" y="160" width="200" height="50" fill="#f0f0f0" stroke="black" rx="4"/>
  <text x="400" y="185" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="14">Language Model</text>

  <rect x="250" y="240" width="300" height="120" fill="#e0f0ff" stroke="black" rx="6"/>
