  <text x="400" y="495" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="14">Transparent Score</text>

  <line x1="400" y1="130" x2="400" y2="153" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="210" x2="400" y2="233" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="360" x2="400" y2="383" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="440" x2="400" y2="463" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
