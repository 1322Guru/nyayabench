  <text x="400" y="290" text-anchor="middle" font-family="Arial" font-size="14">Claim</text>
  <text x="400" y="315" text-anchor="middle" font-family="Arial" font-size="14">Reason</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Evidence + Counterargument + Resolution</text>

  <rect x="300" y="390" width="200" height="50" fill="#f0f0f0" stroke="black" rx="4"/>
